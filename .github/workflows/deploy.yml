name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package artifact
        run: tar -czf release.tar.gz .output

      - name: Configure SSH
        env:
          SSH_KEY_B64: ${{ secrets.PROD_SSH_KEY_B64 }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Upload artifact
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          scp release.tar.gz \
            "$PROD_USER@$PROD_HOST:/tmp/forklift-company-template-${GITHUB_SHA}.tar.gz"

      - name: Deploy release
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          ssh "$PROD_USER@$PROD_HOST" "
            set -e

            RELEASE=/srv/forklift-company-template/releases/${GITHUB_SHA}
            PREVIOUS=\$(readlink -f /srv/forklift-company-template/current || true)

            mkdir -p \"\$RELEASE\"
            tar -xzf \
              /tmp/forklift-company-template-${GITHUB_SHA}.tar.gz \
              -C \"\$RELEASE\"

            rm /tmp/forklift-company-template-${GITHUB_SHA}.tar.gz

            ln -sfn \"\$RELEASE\" \
              /srv/forklift-company-template/current

            if ! sudo /usr/bin/systemctl restart forklift-company-template.service; then
              if [ -n \"\$PREVIOUS\" ]; then
                ln -sfn \"\$PREVIOUS\" \
                  /srv/forklift-company-template/current

                sudo /usr/bin/systemctl restart forklift-company-template.service
              fi

              exit 1
            fi
          "

      - name: Health check
        run: |
          for attempt in {1..10}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              https://forklift.sugacoded.app/ > /dev/null; then
              exit 0
            fi

            sleep 3
          done

          exit 1
